name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Check Token Secret
        run: |
          echo "## Token Check" >> $GITHUB_STEP_SUMMARY
          TOKEN1="${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}"
          TOKEN2="${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MEADOW_05DF89700 }}"
          echo "- AZURE_STATIC_WEB_APPS_API_TOKEN length: ${#TOKEN1}" >> $GITHUB_STEP_SUMMARY
          echo "- AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MEADOW_05DF89700 length: ${#TOKEN2}" >> $GITHUB_STEP_SUMMARY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: aashray_frontend/package-lock.json

      - name: Build Next.js App
        working-directory: aashray_frontend
        run: |
          npm ci
          npm run build
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MEADOW_05DF89700 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "aashray_frontend"
          api_location: ""
          output_location: ""
          skip_app_build: true
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

      - name: Save Debug Info
        if: always()
        run: |
          mkdir -p debug-info
          TOKEN1="${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}"
          TOKEN2="${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MEADOW_05DF89700 }}"
          echo "TOKEN1_LEN=${#TOKEN1}" > debug-info/status.txt
          echo "TOKEN2_LEN=${#TOKEN2}" >> debug-info/status.txt
          find /home/runner/work/_temp/ /tmp/ -type f -name "*.log" -exec cat {} + 2>/dev/null > debug-info/build.log || true

      - name: Upload Debug Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: debug-info

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MEADOW_05DF89700 }}
          action: "close"