name: Aashray Full-Stack CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

jobs:

  # ═══════════════════════════════════════════════════════════════
  # JOB 1 — FRONTEND  (Azure Static Web Apps)
  # ═══════════════════════════════════════════════════════════════
  frontend-deploy:
    name: Frontend → Azure Static Web Apps
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy Frontend
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MEADOW_05DF89700 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/aashray_frontend"
          api_location: ""
          output_location: ""

  # Close preview environment when a PR is closed
  frontend-close-pr:
    name: Frontend → Close PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MEADOW_05DF89700 }}
          action: "close"

  # ═══════════════════════════════════════════════════════════════
  # JOB 2 — BACKEND BUILD & TEST  (admin_api)
  # ═══════════════════════════════════════════════════════════════
  backend-build-and-test:
    name: Backend → Build & Test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'push'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: aashray_partners_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_root_password
      DB_NAME: aashray_partners_ci
      JWT_SECRET: ci_only_jwt_secret
      STORAGE_MODE: local
      EMAIL_MODE: preview
      LOCAL_UPLOAD_DIR: ${{ runner.temp }}/uploads
      EMAIL_PREVIEW_DIR: ${{ runner.temp }}/email-previews

    defaults:
      run:
        working-directory: admin_api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin_api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Run database migrations
        run: npx ts-node src/db/migrate.ts --fresh

      - name: Run integration tests
        run: npm test

      - name: Package deployable artifact
        if: github.event_name != 'pull_request'
        run: |
          rm -rf ../deploy && mkdir ../deploy
          cp -r dist package.json package-lock.json ../deploy/
          cd ../deploy && npm ci --omit=dev

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: deploy
          include-hidden-files: true
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════
  # JOB 3 — BACKEND DEPLOY  (Azure App Service)
  # ═══════════════════════════════════════════════════════════════
  backend-deploy:
    name: Backend → Deploy to Azure App Service
    needs: backend-build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_PUBLIC_URL }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: deploy

      - name: Azure login (OIDC passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT || 'production' }}
          package: deploy

      - name: Smoke test /health
        if: vars.API_PUBLIC_URL != ''
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.API_PUBLIC_URL }}/health" || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Health check failed" && exit 1
